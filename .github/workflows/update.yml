# 빠따넷 일일 갱신과 GitHub Pages 배포
#
# - 매일 한국 시간 09:00·14:00(UTC 00:00·05:00)에 최근 성적·경기 결과·뉴스를 갱신한다.
#   수집 당시 진행 중인 경기는 진행 중으로 표시한다. GitHub 예약은 정각 실행·배포를 보장하지 않는다.
# - 끝난 시즌, 은퇴 선수(past_players.py), 과거 커리어(careers.py --refresh)는 거의 바뀌지 않으므로 여기서 돌리지 않는다.
# - 최근 시즌 순위(standings.py --current-season)와 MLB 구단 선수단(rosters.py --current-season)도 매일 받는다.
# - Pipeline 랭킹은 build.py가 주 1회만 새로 받는다.
# - 수상 기록(awards.py)과 구단 정보(teams.py)는 월요일에만 다시 받는다.
# - main에 push하면 수집 없이 배포만 한다. Actions 탭에서 직접 실행(workflow_dispatch)하면 수집과 배포를 한다.

name: 일일 갱신·배포

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install -r requirements.txt

      # 일부 리그·시즌이 실패해도 build.py는 직전 데이터를 유지한다.
      # 성공한 부분은 커밋·배포하고, 실패는 마지막 단계에서 알린다.
      - name: 최근 시즌 수집·계산
        id: build
        run: |
          set +e
          python scripts/build.py --current-season
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # 최근 시즌에 이적한 선수의 팀별 행 (선수 300명당 요청 7회). 팀별 합이 시즌 합계와 맞지 않는 선수만 다시 받는다.
      # 실패하면 기존 커리어를 유지하고, 선수 페이지는 팀별 행 없이 "N팀 합계"로 보여준다.
      - name: 이적 선수 팀별 기록
        id: traded
        run: |
          set +e
          python scripts/careers.py --traded
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # 최근 시즌 순위 (요청 약 17회). 실패하면 그 시즌 파일을 유지한다.
      - name: 최근 시즌 순위
        id: standings
        run: |
          set +e
          python scripts/standings.py --current-season
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # 최근 시즌 구단 연도별 성적 (요청 2회). 구단 페이지의 연도별 성적 표용. 실패하면 기존 파일을 유지한다.
      - name: 최근 시즌 구단 성적
        id: franchise
        run: |
          set +e
          python scripts/franchise.py --current-season
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # 최근 시즌 리그(AL·NL) 1위 (요청 4회). 선수 페이지 연도별 성적의 굵은 표시용. 실패하면 기존 값을 유지한다.
      - name: 최근 시즌 리그 1위
        id: leaders
        run: |
          set +e
          python scripts/leaders.py --current-season
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # MLB 구단 선수단: 최근 시즌 선수단·구단 성적과 오늘의 40인·액티브 로스터·부상자 명단 (요청 약 152회). 실패하면 기존 파일을 유지한다.
      - name: 구단 선수단
        id: rosters
        run: |
          set +e
          python scripts/rosters.py --current-season
          code=$?
          # 리그 전체 이동 소식과 입단 경로는 선수단 파일로 만든다 (외부 요청 없음)
          python scripts/moves.py --season 2026 || code=1
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # 수상 기록과 구단 역사(우승·영구결번 등)는 자주 바뀌지 않으므로 월요일(UTC)에만 다시 받는다.
      # 두 스크립트 모두 실패하면 기존 파일을 유지한다. teams.py는 awards.json을 읽으므로 뒤에 실행한다.
      - name: 수상 기록·구단 정보 (주 1회)
        id: weekly
        run: |
          set +e
          code=0
          if [ "$(date -u +%u)" = "1" ] && [ "${{ github.event.schedule }}" != "0 5 * * *" ]; then
            python scripts/awards.py || code=1
            python scripts/teams.py || code=1
            python scripts/contract_sources.py || code=1
            python scripts/arrivals.py || code=1
          else
            echo "월요일이 아니라 건너뜀"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: 경기 결과·뉴스
        id: daily
        run: |
          set +e
          python scripts/daily.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 리그 평균·상황별 성적
        id: context
        run: |
          set +e
          python scripts/player_context.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # 공개 시즌 집계만 받는다 (요청 2회). 빈 응답·실패 시 해당 시즌의 직전 파일을 유지한다.
      - name: Statcast 타구·구종
        id: statcast
        run: |
          set +e
          python scripts/statcast.py --current-season
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 투구 위치·핫콜드존
        id: zones
        run: |
          set +e
          python scripts/zones.py --current-season
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
            exit 0
          fi
          git commit -m "data: 일일 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 수집 실패 알림
        if: steps.zones.outputs.code != '0' || steps.statcast.outputs.code != '0' || steps.daily.outputs.code != '0' || steps.context.outputs.code != '0' || steps.build.outputs.code != '0' || steps.traded.outputs.code != '0' || steps.standings.outputs.code != '0' || steps.rosters.outputs.code != '0' || steps.leaders.outputs.code != '0' || steps.franchise.outputs.code != '0' || steps.weekly.outputs.code != '0'
        run: |
          echo "::warning::수집 일부 실패 (위치 구역 코드 ${{ steps.zones.outputs.code }}, Statcast 코드 ${{ steps.statcast.outputs.code }}, 경기·뉴스 코드 ${{ steps.daily.outputs.code }}, 시즌 맥락 코드 ${{ steps.context.outputs.code }}, build.py 코드 ${{ steps.build.outputs.code }}, 이적 선수 코드 ${{ steps.traded.outputs.code }}, 순위 코드 ${{ steps.standings.outputs.code }}, 선수단 코드 ${{ steps.rosters.outputs.code }}, 리그 1위 코드 ${{ steps.leaders.outputs.code }}, 구단 성적 코드 ${{ steps.franchise.outputs.code }}, 주간 수집 코드 ${{ steps.weekly.outputs.code }}). 실패한 부분은 직전 데이터를 유지했다. 로그를 확인한다."

  deploy:
    needs: update
    # push로 update가 건너뛰어졌거나, update가 데이터 커밋까지 마쳤을 때 배포한다.
    if: ${{ !cancelled() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # 브라우저가 읽는 파일만 올린다. data/careers/, data/drafts/는 수집 캐시라 제외한다.
      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp ./*.html _site/
          cp -r css js _site/
          rsync -a --exclude '**/zones/cache/***' --exclude careers/ --exclude drafts/ --exclude contracts_sources/ --exclude contracts_manual.json --exclude arrival_details.json data _site/
          touch _site/.nojekyll
          echo "파일 $(find _site -type f | wc -l)개, $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
