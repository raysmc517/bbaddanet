<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>빠따넷 · 선수</title>
  <link rel="stylesheet" href="css/style.css?v=20261120-zones-history2">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="./">빠따넷</a>
      <nav class="header-nav">
        <a href="search.html">전체 선수 검색</a>
        <a href="./" id="backLink">리더보드</a>
        <a href="standings.html">순위</a>
        <a href="prospects.html">유망주</a>
        <a href="teams.html">구단</a>
        <a href="moves.html">이동</a>
        <a href="daily.html">경기·뉴스</a>
        <a href="following.html">관심</a>
        <a href="awards.html">수상</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <p class="status" id="status" role="status">불러오는 중...</p>

    <section class="profile" id="profile" hidden>
      <img class="player-photo" id="playerPhoto" alt="" width="84" height="126" hidden>
      <div class="profile-main">
        <h1 id="playerName"></h1>
        <p class="profile-sub" id="playerSub"></p>
      </div>
      <nav class="player-nav" id="playerNav" aria-label="선수 페이지 메뉴" hidden>
        <a id="playerOverviewLink">선수 정보·시즌 기록</a>
        <a id="playerAnalysisLink">상세 기록·분석</a>
      </nav>
      <div class="prospect-banner" id="prospectBanner" hidden></div>
      <div class="ped-list" id="pedList" hidden></div>
      <section class="career-summary" id="careerSummary" aria-label="최근 시즌과 통산 요약" hidden></section>
      <a class="career-jump" id="careerJump" href="#careerToolbar" hidden>연도별 기록 바로 보기 ↓</a>
      <details class="profile-details" id="profileDetails">
        <summary>프로필·입단 정보·수상 경력</summary>
        <dl class="profile-facts" id="playerFacts"></dl>
        <div class="award-list" id="awardList" hidden></div>
      </details>
    </section>

    <div id="playerOverview">
      <div class="career-toolbar" id="careerToolbar" hidden>
        <div class="segmented" id="viewSwitch" role="group" aria-label="지표 종류">
          <button type="button" data-value="basic" aria-pressed="true">기본</button>
          <button type="button" data-value="saber" aria-pressed="false">세이버</button>
        </div>
        <label class="field">
          <span>시작 시즌</span>
          <select id="careerFrom"></select>
        </label>
        <label class="field">
          <span>끝 시즌</span>
          <select id="careerTo"></select>
        </label>
        <label class="field">
          <span>레벨</span>
          <select id="careerLevel">
            <option value="mlb">MLB만</option>
            <option value="all">전체 레벨</option>
            <option value="milb">마이너리그만</option>
          </select>
        </label>
        <span class="career-note">MLB.com 표준 표 순서입니다. 한 시즌 여러 팀 기록은 합계 행 아래에 팀별 행을 붙입니다.</span>
      </div>

      <div id="career"></div>
      <div id="playerContracts"></div>
      <div id="playerTransfers"></div>
      <div id="prospectHistory"></div>
    </div>
    <div id="playerAnalysis" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>MLB·MiLB 기록 출처: MLB Stats API. Copyright MLB Advanced Media, L.P. 비상업적 개인 프로젝트입니다.</p>
    </div>
  </footer>

  <script src="js/common.js?v=20261120-zones-history2"></script>
  <script src="js/favorites.js"></script>
  <script src="js/contracts.js"></script>
  <script src="js/statcast.js?v=20261120-zones-history2"></script>
  <script src="js/zones.js?v=20261120-zones-history2"></script>
  <script src="js/player-context.js?v=20261120-zones"></script>
  <script src="js/arrivals.js"></script>
  <script src="js/player.js?v=20261120-zones"></script>
</body>
</html>
